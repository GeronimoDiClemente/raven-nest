name: Check & Staple Mac Notarization

# Polls Apple's notarization queue every 2 hours. When Apple finally accepts
# our pending submission (the first one with a new team ID takes 12-48h for
# "in-depth analysis"), this workflow automatically:
#   1. Downloads the current Nest-1.1.2-arm64.dmg from the v1.1.2 release
#   2. Staples the notarization ticket onto it
#   3. Re-uploads the stapled .dmg replacing the old one
#   4. Promotes v1.1.2 from pre-release to latest
#
# Once v1.1.2 is latest, future runs detect that and exit silently. The
# workflow can be deleted manually after that, or left running (each idle
# check is ~30s of macOS runner time, free on public repos).

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  check-and-staple:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check if v1.1.2 is already latest (no-op)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IS_PRERELEASE=$(gh release view v1.1.2 \
            --repo GeronimoDiClemente/raven-nest \
            --json isPrerelease --jq .isPrerelease 2>/dev/null || echo "missing")

          if [ "$IS_PRERELEASE" = "missing" ]; then
            echo "v1.1.2 release does not exist. Nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$IS_PRERELEASE" = "false" ]; then
            echo "v1.1.2 is already latest (not prerelease). Nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "v1.1.2 is still prerelease. Will check Apple notarization status."
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Query Apple notarization history
        if: steps.check.outputs.skip == 'false'
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          export PATH=/usr/bin:$PATH

          echo "==> Recent notarization submissions for team $APPLE_TEAM_ID:"
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > /tmp/history.json

          cat /tmp/history.json | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          for s in h.get('history', [])[:10]:
              print(f\"  {s.get('id')} | {s.get('status')} | {s.get('createdDate')}\")
          "

          # Find first Accepted submission (most recent)
          ACCEPTED_ID=$(python3 -c "
          import json
          with open('/tmp/history.json') as f:
              h = json.load(f)
          for s in h.get('history', []):
              if s.get('status') == 'Accepted':
                  print(s.get('id'))
                  break
          ")

          if [ -z "$ACCEPTED_ID" ]; then
            echo ""
            echo "Apple has not accepted any submission yet. Will retry in 2 hours."
            echo "accepted=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo ""
          echo "==> Apple accepted submission: $ACCEPTED_ID"
          echo "accepted=true" >> $GITHUB_OUTPUT
          echo "submission_id=$ACCEPTED_ID" >> $GITHUB_OUTPUT

      - name: Download v1.1.2 .dmg from release
        if: steps.notarize.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/dmg
          gh release download v1.1.2 \
            --repo GeronimoDiClemente/raven-nest \
            --pattern "Nest-1.1.2-arm64.dmg" \
            --dir /tmp/dmg/
          ls -lh /tmp/dmg/

      - name: Staple notarization ticket
        if: steps.notarize.outputs.accepted == 'true'
        run: |
          set -e
          export PATH=/usr/bin:$PATH
          xcrun stapler staple /tmp/dmg/Nest-1.1.2-arm64.dmg
          xcrun stapler validate /tmp/dmg/Nest-1.1.2-arm64.dmg
          echo "==> .dmg stapled successfully"

      - name: Re-upload stapled .dmg to release
        if: steps.notarize.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload v1.1.2 /tmp/dmg/Nest-1.1.2-arm64.dmg \
            --repo GeronimoDiClemente/raven-nest \
            --clobber

      - name: Promote v1.1.2 to latest
        if: steps.notarize.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit v1.1.2 \
            --repo GeronimoDiClemente/raven-nest \
            --latest \
            --prerelease=false

          echo ""
          echo "==> v1.1.2 is now Latest with stapled .dmg!"
          echo "    Users on v1.1.1 will receive the auto-update prompt."
          echo "    Future releases (v1.1.3+) will be stapled automatically by release.yml."
          echo ""
          echo "::notice::v1.1.2 has been promoted to latest. This workflow can be deleted."
