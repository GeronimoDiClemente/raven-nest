name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The root tsconfig.json is solution-style (`files: []` + `references`),
      # so `tsc --noEmit` there type-checks nothing and always exits 0. The
      # two referenced projects are the real checks — run both explicitly
      # (--composite false + --noEmit so this stays a pure check: composite
      # projects normally require emitted .tsbuildinfo, which we don't want
      # from a CI type-check step, and would also emit .js/.d.ts next to
      # sources under `-b`).
      - run: npx tsc -p tsconfig.node.json --noEmit --composite false
      - run: npx tsc -p tsconfig.web.json --noEmit --composite false

  test:
    runs-on: ubuntu-latest
    env:
      # src/lib/supabase.ts creates the client at import time; tests swap it via the
      # proxy in that module, but the import still needs syntactically valid values.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20, ONLY on this job: `npm test` runs `native:node`, which needs a
          # better-sqlite3 binary for the Node ABI. better-sqlite3@12.11.1 publishes no
          # prebuild for ABI 115 (Node 20) — that asset 404s, while 127/137/141 exist — so
          # on 20 `prebuild-install` always failed and every single CI run fell through to
          # compiling from source. Node 22 is ABI 127, which has a published prebuild, so
          # the download succeeds and CI stops compiling native code entirely.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # server/ (docs/superpowers/specs/2026-08-31-memory-sync-backend-design.md §12.1) es un
  # paquete npm propio, aislado del Electron de arriba — nunca corrió en CI hasta este job.
  # Sus 214 tests (vitest) van contra Postgres REAL, nunca mocks, así que hace falta el
  # servicio de abajo — mismas credenciales que server/README.md documenta para levantarlo
  # en local (postgres:16-alpine, DB nest_memory, password nestmem), sólo que acá vive en
  # localhost:5432 (el puerto por defecto del contenedor de servicio de Actions), no 55432.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nestmem
          POSTGRES_DB: nest_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:nestmem@localhost:5432/nest_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      # migrate() corre sola al primer query de cada archivo de test (db.ts) — no hace
      # falta un paso de "aplicar migraciones" aparte.
      - working-directory: server
        run: npx tsc --noEmit
      - working-directory: server
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
