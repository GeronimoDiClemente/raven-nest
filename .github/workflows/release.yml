name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  decrypt:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install git-crypt
        run: sudo apt-get install -y git-crypt

      - name: Decrypt repository
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/git-crypt-key
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Get version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Upload decrypted source
        uses: actions/upload-artifact@v4
        with:
          name: decrypted-source
          path: |
            .
            !.git
            !node_modules
          retention-days: 1

  build-mac:
    needs: decrypt
    runs-on: macos-latest
    steps:
      - name: Download decrypted source
        uses: actions/download-artifact@v4
        with:
          name: decrypted-source
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix distutils for node-gyp
        run: pip3 install setuptools --break-system-packages

      - run: npm ci

      - name: Build Mac
        # Signing config is preconfigured here (not in package.json) because
        # electron-builder rejects `hardenedRuntime + entitlements` when no
        # cert is present. We pass the full signing+notarize config as CLI
        # flags only when MAC_CSC_LINK is set; otherwise the build produces
        # unsigned binaries.
        # When secrets are loaded, the build firma + notariza automáticamente.
        run: |
          EXTRA_FLAGS=""
          if [ -n "$CSC_LINK" ]; then
            EXTRA_FLAGS="\
              --c.mac.hardenedRuntime=true \
              --c.mac.gatekeeperAssess=false \
              --c.mac.entitlements=build/entitlements.mac.plist \
              --c.mac.entitlementsInherit=build/entitlements.mac.plist \
              --c.mac.notarize=true"
          fi
          npx electron-vite build && npx electron-builder --mac --publish never $EXTRA_FLAGS
        env:
          # Code signing: if MAC_CSC_LINK is not set, electron-builder skips signing.
          # When set, requires the four APPLE_* secrets for notarization.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK == '' && 'false' || 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ secrets.MAIN_VITE_GITHUB_CLIENT_ID }}
          MAIN_VITE_GITLAB_CLIENT_ID: ${{ secrets.MAIN_VITE_GITLAB_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml

  build-win:
    needs: decrypt
    runs-on: windows-latest
    steps:
      - name: Download decrypted source
        uses: actions/download-artifact@v4
        with:
          name: decrypted-source
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build Windows
        run: npx electron-vite build && npx electron-builder --win --publish never
        env:
          # Code signing: if WIN_CSC_LINK is not set, electron-builder skips signing.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ secrets.MAIN_VITE_GITHUB_CLIENT_ID }}
          MAIN_VITE_GITLAB_CLIENT_ID: ${{ secrets.MAIN_VITE_GITLAB_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            dist/*.exe
            dist/*.yml

  build-linux:
    needs: decrypt
    runs-on: ubuntu-latest
    steps:
      - name: Download decrypted source
        uses: actions/download-artifact@v4
        with:
          name: decrypted-source
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build Linux
        run: npx electron-vite build && npx electron-builder --linux --publish never
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ secrets.MAIN_VITE_GITHUB_CLIENT_ID }}
          MAIN_VITE_GITLAB_CLIENT_ID: ${{ secrets.MAIN_VITE_GITLAB_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml

  deploy-functions:
    needs: decrypt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download decrypted source
        uses: actions/download-artifact@v4
        with:
          name: decrypted-source
          path: .

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          supabase functions deploy stripe-checkout --no-verify-jwt --project-ref qkqlsytxtshgjxwmafpw
          supabase functions deploy stripe-webhook --project-ref qkqlsytxtshgjxwmafpw
          supabase functions deploy on-signup --no-verify-jwt --project-ref qkqlsytxtshgjxwmafpw
          supabase functions deploy github-oauth --no-verify-jwt --project-ref qkqlsytxtshgjxwmafpw
          supabase functions deploy send-invite-email --no-verify-jwt --project-ref qkqlsytxtshgjxwmafpw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Supabase function secrets
        run: |
          supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --project-ref qkqlsytxtshgjxwmafpw
          supabase secrets set STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" --project-ref qkqlsytxtshgjxwmafpw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  release:
    needs: [build-mac, build-win, build-linux, decrypt]
    runs-on: ubuntu-latest
    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts/mac

      - name: Download win artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: artifacts/win

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Delete existing release and tag
        run: gh release delete v${{ needs.decrypt.outputs.version }} --yes --cleanup-tag --repo GeronimoDiClemente/raven-nest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.decrypt.outputs.version }}
          name: v${{ needs.decrypt.outputs.version }}
          files: |
            artifacts/mac/*.dmg
            artifacts/mac/*.zip
            artifacts/mac/*.yml
            artifacts/win/*.exe
            artifacts/win/*.yml
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.yml
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

