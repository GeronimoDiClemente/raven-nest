name: Check notarization status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Check submission status and log
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export PATH=/usr/bin:$PATH
          echo "==> Submission history:"
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json | python3 -c "
import json,sys
h=json.load(sys.stdin)
for s in h.get('history',[])[:10]:
    print(f\"  {s['id']} | {s['status']:12s} | {s.get('name','?')} | {s['createdDate']}\")
"
          echo ""
          echo "==> Log for latest submission (fa8dcb13-29c2-4bed-95b0-dd0b2220326d):"
          xcrun notarytool log fa8dcb13-29c2-4bed-95b0-dd0b2220326d \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1 || echo "(log not available yet — still in progress)"
